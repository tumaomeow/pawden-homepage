<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="爪爪窝的个人展示与学习主页，仅用于整理个人项目入口，不提供任何在线服务。"
    />
    <meta name="theme-color" content="#f3f0e9" id="theme-color" />
    <title>爪爪窝 · Personal Index</title>
    <script>
      (() => {
        const savedTheme = (() => {
          try {
            return localStorage.getItem("pawden-theme");
          } catch {
            return null;
          }
        })();
        const preferredTheme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";

        document.documentElement.dataset.theme = preferredTheme;
        document.documentElement.style.colorScheme = preferredTheme;
        document.getElementById("theme-color").content =
          preferredTheme === "dark" ? "#141413" : "#f3f0e9";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./images/site-logo.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#projects-page">跳到项目页</a>

    <div class="page-shell">
      <!-- 网站标头：昵称和站点 Logo -->
      <header class="site-header">
        <a class="identity" href="#top" aria-label="回到爪爪窝首页顶部">
          <span class="brand-mark">
            <!-- 替换资源：images/site-logo.svg（建议 256 × 256，1:1） -->
            <img
              src="./images/site-logo.svg"
              width="64"
              height="64"
              alt="爪爪窝网站 Logo"
            />
          </span>
          <span class="identity-copy">
            <span class="brand-name">爪爪窝</span>
            <span class="brand-caption">pawden</span>
          </span>
        </a>

        <div class="header-tools">
          <div class="header-meta" aria-label="网站状态">
            <span id="page-status">01 / HOME</span>
            <span class="status-dot" aria-hidden="true"></span>
            <span>仅限个人展示</span>
          </div>
          <button
            class="theme-toggle"
            type="button"
            aria-label="切换到夜间模式"
            aria-pressed="false"
            title="切换黑白主题"
          >
            <span class="theme-switch" aria-hidden="true">
              <span class="theme-switch-knob"></span>
            </span>
            <span class="theme-toggle-label">夜间</span>
          </button>
        </div>
      </header>

      <main id="top" class="page-viewport">
        <section
          class="page-panel page-panel--home is-active"
          id="home-page"
          data-page-panel="0"
          aria-labelledby="hero-title"
        >
          <section class="hero" aria-labelledby="hero-title">
            <div class="hero-heading">
              <p class="eyebrow">
                <span>COLLECTION</span>
                <span>NO. 001 — 008</span>
              </p>
              <h1 id="hero-title">
                把散落的地方，
                <span>收在这一页。</span>
              </h1>
              <p class="hero-intro">
                这里汇集我创建的网页与个人项目。选择一个入口，继续浏览。
              </p>
            </div>

            <!-- 用途声明：请勿删除这段明确声明 -->
            <aside class="notice" aria-label="网站用途声明">
              <div class="notice-label">
                <span class="notice-icon" aria-hidden="true">i</span>
                <span>NOTICE / 使用说明</span>
              </div>
              <p>
                本网站仅供个人展示与学习使用，<strong>不提供任何在线服务</strong>。
              </p>
            </aside>
          </section>

          <div class="scroll-cue" aria-hidden="true">
            <span class="scroll-cue-icon">↓</span>
            <span>向下滚动进入项目</span>
          </div>
        </section>

        <section
          class="page-panel page-panel--projects is-after"
          id="projects-page"
          data-page-panel="1"
          aria-labelledby="projects-title"
          aria-hidden="true"
          inert
        >
          <section class="projects" aria-labelledby="projects-title">
            <div class="section-heading">
              <div>
                <p class="section-number">02</p>
                <h2 id="projects-title">项目入口</h2>
              </div>
              <p class="section-hint">
                点击任意项目，在新标签页打开
                <span aria-hidden="true">↗</span>
              </p>
            </div>

            <!-- 项目内容集中修改：./projects.js -->
            <div class="project-list" id="project-list"></div>
          </section>
        </section>
      </main>

      <nav class="page-navigation" aria-label="页面切换">
        <button
          class="page-navigation-button is-active"
          type="button"
          data-page-target="0"
          aria-label="切换到首页"
          aria-current="page"
        >
          <span class="page-navigation-dot" aria-hidden="true"></span>
          <span class="page-navigation-label">01 首页</span>
        </button>
        <button
          class="page-navigation-button"
          type="button"
          data-page-target="1"
          aria-label="切换到项目入口页面"
        >
          <span class="page-navigation-dot" aria-hidden="true"></span>
          <span class="page-navigation-label">02 项目</span>
        </button>
      </nav>

      <footer class="site-footer">
        <div class="footer-left">
          <span class="footer-mark">p.</span>
          <p>
            <strong>本网站仅供个人展示与学习使用，不提供任何在线服务。</strong>
          </p>
        </div>
        <div class="footer-right">
          <span><span id="year">2026</span> · 爪爪窝</span>
          <span>MADE FOR THE WEB</span>
        </div>
      </footer>
    </div>

    <template id="project-card-template">
      <a class="project-link" target="_blank" rel="noopener noreferrer">
        <span class="project-main">
          <span class="project-logo-stack">
            <span class="project-logo">
              <img width="56" height="56" alt="" loading="lazy" />
            </span>
            <span class="project-number" aria-hidden="true"></span>
          </span>
          <span class="project-copy">
            <span class="project-title"></span>
            <span class="project-description"></span>
          </span>
        </span>
        <span class="project-side">
          <span class="project-domain"></span>
          <span class="project-arrow" aria-hidden="true">↗</span>
        </span>
      </a>
    </template>

    <script src="./projects.js"></script>
    <script>
      const root = document.documentElement;
      const themeToggle = document.querySelector(".theme-toggle");
      const themeToggleLabel = document.querySelector(".theme-toggle-label");
      const themeColor = document.getElementById("theme-color");

      const applyTheme = (theme, persist = true) => {
        const isDark = theme === "dark";

        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        themeToggle.setAttribute("aria-pressed", String(isDark));
        themeToggle.setAttribute(
          "aria-label",
          isDark ? "切换到日间模式" : "切换到夜间模式",
        );
        themeToggleLabel.textContent = isDark ? "日间" : "夜间";
        themeColor.content = isDark ? "#141413" : "#f3f0e9";

        if (persist) {
          try {
            localStorage.setItem("pawden-theme", theme);
          } catch {
            // 浏览器禁用本地存储时，主题仍可在当前页面内切换。
          }
        }
      };

      applyTheme(root.dataset.theme || "light", false);

      themeToggle.addEventListener("click", () => {
        applyTheme(root.dataset.theme === "dark" ? "light" : "dark");
      });

      document.getElementById("year").textContent = new Date().getFullYear();

      const pages = [...document.querySelectorAll("[data-page-panel]")];
      const pageButtons = [
        ...document.querySelectorAll("[data-page-target]"),
      ];
      const pageStatus = document.getElementById("page-status");
      const pageLabels = ["01 / HOME", "02 / PROJECTS"];
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      const transitionDuration = reducedMotion ? 0 : 720;
      const wheelThreshold = 44;
      let currentPage = 0;
      let pageLocked = false;
      let wheelAmount = 0;
      let wheelResetTimer;
      let touchStartY = null;

      const switchPage = (nextPage) => {
        const safePage = Math.max(0, Math.min(pages.length - 1, nextPage));

        if (safePage === currentPage || pageLocked) {
          wheelAmount = 0;
          return;
        }

        pageLocked = true;
        currentPage = safePage;

        pages.forEach((panel, index) => {
          const isCurrent = index === currentPage;
          panel.classList.toggle("is-active", isCurrent);
          panel.classList.toggle("is-before", index < currentPage);
          panel.classList.toggle("is-after", index > currentPage);
          panel.setAttribute("aria-hidden", String(!isCurrent));
          panel.inert = !isCurrent;
        });

        pageButtons.forEach((button, index) => {
          const isCurrent = index === currentPage;
          button.classList.toggle("is-active", isCurrent);
          if (isCurrent) {
            button.setAttribute("aria-current", "page");
          } else {
            button.removeAttribute("aria-current");
          }
        });

        pageStatus.textContent = pageLabels[currentPage];
        document.body.dataset.page = String(currentPage);
        wheelAmount = 0;

        window.setTimeout(() => {
          pageLocked = false;
        }, transitionDuration);
      };

      pageButtons.forEach((button) => {
        button.addEventListener("click", () => {
          switchPage(Number(button.dataset.pageTarget));
        });
      });

      document.querySelector(".identity").addEventListener("click", (event) => {
        event.preventDefault();
        switchPage(0);
      });

      document.querySelector(".skip-link").addEventListener("click", (event) => {
        event.preventDefault();
        switchPage(1);
        document.getElementById("projects-title").focus({ preventScroll: true });
      });

      document.getElementById("projects-title").tabIndex = -1;

      window.addEventListener(
        "wheel",
        (event) => {
          if (event.ctrlKey || Math.abs(event.deltaY) <= Math.abs(event.deltaX)) {
            return;
          }

          if (pageLocked) {
            event.preventDefault();
            return;
          }

          const panel = pages[currentPage];
          const canScroll = panel.scrollHeight > panel.clientHeight + 2;
          const atTop = panel.scrollTop <= 0;
          const atBottom =
            panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 2;
          const movingDown = event.deltaY > 0;

          if (canScroll && ((movingDown && !atBottom) || (!movingDown && !atTop))) {
            event.preventDefault();
            panel.scrollTop += event.deltaY;
            wheelAmount = 0;
            return;
          }

          event.preventDefault();

          wheelAmount += event.deltaY;
          window.clearTimeout(wheelResetTimer);
          wheelResetTimer = window.setTimeout(() => {
            wheelAmount = 0;
          }, 180);

          if (Math.abs(wheelAmount) >= wheelThreshold) {
            switchPage(currentPage + Math.sign(wheelAmount));
          }
        },
        { passive: false },
      );

      window.addEventListener("keydown", (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }

        const nextKeys = ["ArrowDown", "ArrowRight", "PageDown"];
        const previousKeys = ["ArrowUp", "ArrowLeft", "PageUp"];

        if (nextKeys.includes(event.key)) {
          event.preventDefault();
          switchPage(currentPage + 1);
        } else if (previousKeys.includes(event.key)) {
          event.preventDefault();
          switchPage(currentPage - 1);
        } else if (event.key === "Home") {
          event.preventDefault();
          switchPage(0);
        } else if (event.key === "End") {
          event.preventDefault();
          switchPage(pages.length - 1);
        }
      });

      document.addEventListener(
        "touchstart",
        (event) => {
          touchStartY = event.touches[0]?.clientY ?? null;
        },
        { passive: true },
      );

      document.addEventListener(
        "touchend",
        (event) => {
          if (touchStartY === null || pageLocked) {
            return;
          }

          const endY = event.changedTouches[0]?.clientY ?? touchStartY;
          const swipeDistance = touchStartY - endY;
          const panel = pages[currentPage];
          const canScroll = panel.scrollHeight > panel.clientHeight + 2;
          const atTop = panel.scrollTop <= 0;
          const atBottom =
            panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 2;

          if (
            canScroll &&
            ((swipeDistance > 0 && !atBottom) ||
              (swipeDistance < 0 && !atTop))
          ) {
            touchStartY = null;
            return;
          }

          if (Math.abs(swipeDistance) >= 58) {
            switchPage(currentPage + Math.sign(swipeDistance));
          }
          touchStartY = null;
        },
        { passive: true },
      );
    </script>
  </body>
</html>
